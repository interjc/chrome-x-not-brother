name: Release

# A version bump that reaches main publishes a GitHub Release with the Chrome
# and Safari packages. The Chrome Web Store upload stays manual; Safari builds
# are a manual-install community channel. See docs/safari.md.

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:
    inputs:
      safari_only:
        description: "Rebuild only the signed Safari app for the current version's existing release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      created: ${{ steps.meta.outputs.created }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to publish."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.meta.outputs.created == 'true'
        run: npm ci

      - if: steps.meta.outputs.created == 'true'
        run: npm run check

      - if: steps.meta.outputs.created == 'true'
        run: npm run package

      - if: steps.meta.outputs.created == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            "artifacts/not-brother-$VERSION.zip" \
            "artifacts/not-brother-safari-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Not Brother v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  safari-app:
    needs: release
    if: >-
      vars.SAFARI_SIGNING == 'true' &&
      (needs.release.outputs.created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.safari_only))
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
      BUNDLE_ID: ${{ vars.SAFARI_BUNDLE_ID || 'io.github.interjc.notbrother' }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate signing scratch files
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Fetch the Safari extension folder from the release
        run: |
          gh release download "v$VERSION" \
            --pattern "not-brother-safari-$VERSION.zip" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/not-brother-safari-$VERSION.zip" -d "$RUNNER_TEMP/extension"

      - name: Import the Developer ID certificate and API key
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Generate the Safari app project
        run: |
          xcrun safari-web-extension-packager "$RUNNER_TEMP/extension" \
            --app-name "Not Brother" \
            --bundle-identifier "$BUNDLE_ID" \
            --macos-only --swift --copy-resources \
            --project-location "$RUNNER_TEMP/xcode" \
            --no-open --no-prompt --force
          project=$(find "$RUNNER_TEMP/xcode" -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          scheme=$(xcodebuild -list -json -project "$project" \
            | jq -r '.project.schemes[] | select(test("Extension") | not)' | head -n 1)
          echo "Project: $project / scheme: $scheme"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"

      - name: Archive with Developer ID signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/NotBrother.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN"
          app=$(find "$RUNNER_TEMP/NotBrother.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Attach the signed app to the release
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Not-Brother-Safari-$VERSION.zip"
          gh release upload "v$VERSION" "$RUNNER_TEMP/Not-Brother-Safari-$VERSION.zip" --clobber

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$ASC_KEY_PATH"
