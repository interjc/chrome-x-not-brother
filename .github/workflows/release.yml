name: Release

# Every push to main rebuilds the Safari packages. A version that has no
# Release yet gets one, with the Chrome ZIP that matches the Chrome Web Store
# upload; later pushes with the same version overwrite only the Safari assets
# and leave the Chrome ZIP alone. The Chrome Web Store upload stays manual;
# Safari builds are a manual-install community channel. See docs/safari.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue rather than cancel, so a half-published Release is never abandoned.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version exists; its Safari assets will be replaced."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm run check

      - run: npm run package

      - name: Publish a new version
        if: steps.meta.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          chrome="not-brother-$VERSION.zip"
          safari="not-brother-safari-$VERSION.zip"
          # file#label shows a plain-language label on the Release page.
          gh release create "v$VERSION" \
            "artifacts/$chrome#$(node scripts/release-notes.mjs --label "$chrome")" \
            "artifacts/$safari#$(node scripts/release-notes.mjs --label "$safari")" \
            --target "$GITHUB_SHA" \
            --title "Not Brother v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Refresh the Safari folder on the current version
        if: steps.meta.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          safari="not-brother-safari-$VERSION.zip"
          gh release upload "v$VERSION" \
            "artifacts/$safari#$(node scripts/release-notes.mjs --label "$safari")" --clobber
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          # Relabel the Chrome ZIP in place; its file stays as first published.
          chrome="not-brother-$VERSION.zip"
          chrome_api=$(gh release view "v$VERSION" --json assets \
            --jq ".assets[] | select(.name == \"$chrome\") | .apiUrl")
          if [ -n "$chrome_api" ]; then
            gh api -X PATCH "$chrome_api" -f name="$chrome" \
              -f label="$(node scripts/release-notes.mjs --label "$chrome")" >/dev/null
          fi
          echo "Replaced not-brother-safari-$VERSION.zip from $GITHUB_SHA; the Chrome ZIP is unchanged."

  safari-app:
    needs: release
    if: vars.SAFARI_SIGNING == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
      BUNDLE_ID: ${{ vars.SAFARI_BUNDLE_ID || 'io.github.interjc.notbrother' }}
      # Safari 18.4, the floor for Developer ID extensions, ships back to macOS 13.
      # The packager otherwise targets the runner's own SDK (macOS 26.x).
      MACOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5

      - name: Locate signing scratch files
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Fetch the Safari extension folder from the release
        run: |
          gh release download "v$VERSION" \
            --pattern "not-brother-safari-$VERSION.zip" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/not-brother-safari-$VERSION.zip" -d "$RUNNER_TEMP/extension"

      - name: Import the Developer ID certificate and API key
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          # The intermediate goes in first so find-identity can validate the chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "Apple Developer ID G2 intermediate: $(security import \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" 2>&1 || true)"
          # Repack the .p12 with OpenSSL before handing it to macOS: Keychain
          # Access, Xcode, and OpenSSL 1/3 exports differ in bag encryption,
          # and `security import` silently drops key bags it cannot read.
          openssl_bin="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$openssl_bin" ] || openssl_bin=/usr/bin/openssl
          source_p12="$RUNNER_TEMP/source.p12"
          signing_p12="$RUNNER_TEMP/signing.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$source_p12"
          echo "Secret .p12 sha256: $(shasum -a 256 "$source_p12" | cut -d ' ' -f 1)"
          echo "  Compare locally with: shasum -a 256 DeveloperID.p12"
          # Older exports use RC2, which OpenSSL 3 reads only with -legacy.
          p12_read() {
            "$openssl_bin" pkcs12 $legacy -in "$source_p12" \
              -passin env:MACOS_CERT_PASSWORD "$@"
          }
          legacy=""
          if ! p12_read -nodes -out /dev/null 2>/dev/null; then
            legacy="-legacy"
          fi
          if ! p12_read -nodes -out /dev/null; then
            rm -f "$source_p12"
            echo "::error title=Could not read MACOS_CERT_P12_BASE64::OpenSSL cannot open the .p12. Check MACOS_CERT_PASSWORD and that the base64 is complete (docs/apple-signing.md, sections 2.4 and 5)."
            exit 1
          fi
          echo "Secret .p12 structure (no key material):"
          p12_read -info -noout 2>&1 | sed 's/^/  /'
          key_lines=$(p12_read -nocerts -nodes 2>/dev/null \
            | grep -c "BEGIN.*PRIVATE KEY" || true)
          cert_lines=$(p12_read -nokeys 2>/dev/null \
            | grep -c "BEGIN CERTIFICATE" || true)
          echo "Secret .p12 holds $key_lines private key(s) and $cert_lines certificate(s)."
          if [ "$key_lines" -eq 0 ] || [ "$cert_lines" -eq 0 ]; then
            rm -f "$source_p12"
            if [ "$key_lines" -eq 0 ]; then
              missing="no private key (only the certificate was exported)"
            else
              missing="no certificate (only the private key row was exported)"
            fi
            echo "::error title=MACOS_CERT_P12_BASE64 is incomplete::The stored .p12 has $missing. Signing needs both. In Keychain Access > login > My Certificates, right-click the Developer ID Application certificate row itself (not the key under it) and export .p12, or rebuild it with OpenSSL (docs/apple-signing.md, sections 2.3 and 2.4). If the sha256 above differs from your local file, the secret holds a different file."
            exit 1
          fi
          # -export reads its input twice (key, then certificates), so it needs
          # a file rather than a pipe. Keep it private and remove it at once.
          bundle_pem="$RUNNER_TEMP/bundle.pem"
          (umask 077 && p12_read -nodes -out "$bundle_pem" 2>/dev/null)
          rm -f "$source_p12"
          "$openssl_bin" pkcs12 -export -in "$bundle_pem" -out "$signing_p12" \
            -passout env:MACOS_CERT_PASSWORD \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            || { rm -f "$bundle_pem"; exit 1; }
          rm -f "$bundle_pem"
          import_result=$(security import "$signing_p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign 2>&1) || {
            rm -f "$signing_p12"
            echo "::error title=Could not import the signing identity::$import_result"
            exit 1
          }
          rm -f "$signing_p12"
          echo "p12 import: $import_result"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application"; then
            security find-identity -p codesigning "$KEYCHAIN" || true
            echo "::error title=No valid Developer ID Application identity::The key imported as \"$import_result\" but no valid Developer ID Application identity is available. Check that the certificate is a Developer ID Application certificate, not revoked or expired, and that its private key matches (docs/apple-signing.md, section 8)."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"

      - name: Generate the Safari app project
        run: |
          xcrun safari-web-extension-packager "$RUNNER_TEMP/extension" \
            --app-name "Not Brother" \
            --bundle-identifier "$BUNDLE_ID" \
            --macos-only --swift --copy-resources \
            --project-location "$RUNNER_TEMP/xcode" \
            --no-open --no-prompt --force
          project=$(find "$RUNNER_TEMP/xcode" -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          # The packager applies --bundle-identifier to the extension only and
          # derives the app ID from the app name, so the extension ID is not
          # prefixed by the app ID and archive validation fails. Pin both.
          pbxproj="$project/project.pbxproj"
          echo "Packager bundle IDs:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$pbxproj" | sort | uniq -c
          perl -pi -e '
            if (/PRODUCT_BUNDLE_IDENTIFIER = /) {
              my $id = /\.Extension"?;/ ? "$ENV{BUNDLE_ID}.Extension" : $ENV{BUNDLE_ID};
              s/(PRODUCT_BUNDLE_IDENTIFIER = ).*;/$1"$id";/;
            }' "$pbxproj"
          echo "Pinned bundle IDs:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" "$pbxproj" | sort | uniq -c
          # The app's Swift source names the extension it opens settings for.
          find "$(dirname "$project")" -name "*.swift" -exec perl -pi -e \
            's/"[A-Za-z0-9.-]+\.Extension"/"$ENV{BUNDLE_ID}.Extension"/g' {} +
          grep -rn --include="*.swift" "\.Extension\"" "$(dirname "$project")" || true
          scheme=$(xcodebuild -list -json -project "$project" \
            | jq -r '.project.schemes[] | select(test("Extension") | not)' | head -n 1)
          echo "Project: $project / scheme: $scheme"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"

      - name: Archive with Developer ID signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/NotBrother.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/scripts/safari/NotBrother.entitlements" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN"
          app=$(find "$RUNNER_TEMP/NotBrother.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          # Safari ignores an extension that is not sandboxed, and none of the
          # signature, Gatekeeper, or notarization checks catch that.
          for bundle in "$app" "$app"/Contents/PlugIns/*.appex; do
            entitlements=$(codesign -d --entitlements :- "$bundle" 2>/dev/null || true)
            echo "$(basename "$bundle") entitlements:"
            echo "$entitlements" | grep -A1 "<key>" | sed 's/^/  /'
            if ! echo "$entitlements" | grep -q "com.apple.security.app-sandbox"; then
              echo "::error title=Missing App Sandbox entitlement::$(basename "$bundle") was signed without com.apple.security.app-sandbox, so Safari would not list the extension."
              exit 1
            fi
          done
          for bundle in "$app" "$app"/Contents/PlugIns/*.appex; do
            plist="$bundle/Contents/Info.plist"
            echo "$(basename "$bundle"): $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")," \
              "version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")," \
              "macOS $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist" 2>/dev/null || echo '?')+"
          done
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Attach the signed app to the release
        run: |
          # Asset names are case-insensitive on GitHub, so this must not differ
          # from not-brother-safari-<version>.zip by case alone.
          app_zip="not-brother-safari-app-$VERSION.zip"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/$app_zip"
          gh release upload "v$VERSION" \
            "$RUNNER_TEMP/$app_zip#$(node scripts/release-notes.mjs --label "$app_zip")" --clobber

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$ASC_KEY_PATH"
