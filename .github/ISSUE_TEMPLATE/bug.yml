name: Bug / 缺陷
description: Report incorrect annotation, a crash, or behavior that disagrees with the docs.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not paste passwords, cookies, real relationship exports, or other people's avatars and source URLs.
  - type: input
    id: version
    attributes:
      label: Extension version / 扩展版本
      description: Shown in the Relationship Fieldbook footer.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version / Chrome 版本
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: X page type / X 页面类型
      options:
        - Home timeline
        - Post / reply thread
        - Profile
        - Following or followers
        - Search
        - Notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 预期
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual / 实际
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
    validations:
      required: true
